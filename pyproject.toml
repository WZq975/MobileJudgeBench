[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mobilejudgebench"
version = "1.0.0"
description = "Loader and tooling for MobileJudgeBench: human-annotated mobile-agent trajectories for evaluating LLM judges"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
images = ["Pillow>=9"]
convert = ["Pillow>=9", "numpy>=1.23"]
judges = ["requests>=2.28", "Pillow>=9"]

[project.urls]
Repository = "https://github.com/WZq975/MobileJudgeBench"
Dataset = "https://huggingface.co/datasets/WesleyWzq/MobileJudgeBench"
Paper = "https://arxiv.org/abs/2608.11434"

[tool.setuptools]
packages = ["mobilejudgebench"]
